<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 3a</title>
    <style>
        .kotak {
            width: 300px;
            padding: 25px;
            border: 5px solid #1f4e79;
            background: #cfe2f3;
            margin-bottom: 20px;
        }
        .content-box { box-sizing: content-box; }
        .border-box  { box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="kotak content-box">content-box</div>
    <div class="kotak border-box">border-box</div>
</body>
</html>
